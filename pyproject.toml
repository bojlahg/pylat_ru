[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pylat_ru"
version = "0.1.0a0"
description = "Native Python reimplementation of the Russian LanguageTool pipeline and rule engine"
readme = "README.md"
license = { text = "LGPL-2.1-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "pylat_ru contributors" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "regex>=2024.5.15,<=2026.7.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pylat_ru = ["py.typed", "resources/*.json", "resources/*.txt", "resources/ru/*", "resources/ru/hunspell/*"]
"pylat_ru.resources.ru.hunspell" = ["*.dict", "*.info", "*.txt"]
"pylat_ru.resources.rules.ru" = ["*.xml", "*.txt"]
"pylat_ru.resources.disambiguation" = ["*.xml"]
"pylat_ru.resources.tagger" = ["*.dict", "*.info"]
"pylat_ru.resources.synth" = ["*.dict", "*.info"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
pythonpath = [".", "src"]

