name: Oracle Conformance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-oracle-suite:
    name: LT 6.8 trusted oracle + full pytest
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      LT_COMMIT: e807fcde6a6506191e1470744d2345da28c26be6
      LT_VERSION: "6.8"
      MAVEN_VERSION: "3.9.12"

    steps:
      - name: Checkout pylat_ru
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Install exact Maven version
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --location \
            "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            -o /tmp/maven.tar.gz
          mkdir -p "$HOME/.local/maven"
          tar -xzf /tmp/maven.tar.gz -C "$HOME/.local/maven" --strip-components=1
          echo "$HOME/.local/maven/bin" >> "$GITHUB_PATH"
          "$HOME/.local/maven/bin/mvn" --version

      - name: Fetch exact LanguageTool source commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .oracle_source/languagetool
          git -C .oracle_source/languagetool init
          git -C .oracle_source/languagetool remote add origin https://github.com/languagetool-org/languagetool.git
          git -C .oracle_source/languagetool fetch --depth 1 origin "$LT_COMMIT"
          git -C .oracle_source/languagetool checkout --detach FETCH_HEAD
          test "$(git -C .oracle_source/languagetool rev-parse HEAD)" = "$LT_COMMIT"

      - name: Build pinned LanguageTool standalone oracle
        shell: bash
        working-directory: .oracle_source/languagetool
        run: |
          set -euo pipefail
          mvn clean package -DskipTests

      - name: Install oracle into pylat_ru cache location
        shell: bash
        run: |
          set -euo pipefail
          src=".oracle_source/languagetool/languagetool-standalone/target/LanguageTool-${LT_VERSION}/languagetool-commandline.jar"
          dst=".oracle_cache/LanguageTool-${LT_VERSION}/languagetool-commandline.jar"
          test -f "$src"
          mkdir -p "$(dirname "$dst")"
          cp "$src" "$dst"
          sha256sum "$dst"

      - name: Validate oracle against compat/oracle_manifest.json
        run: |
          python - <<'PY'
          from tools.differential_lt import JavaLanguageToolOracle

          result = JavaLanguageToolOracle().validate_oracle()
          print("verified:", result["is_verified"])
          print("build_id:", result["oracle_build_id"])
          print("jar_sha256:", result["jar_sha256"])
          print("pinned_commit:", result["pinned_commit"])
          assert result["is_verified"] is True
          PY

      - name: Run complete test suite with trusted oracle
        run: |
          python -m pytest --junitxml=pytest-oracle-results.xml

      - name: Require zero skipped tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("pytest-oracle-results.xml")
          root = ET.parse(path).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          skipped = sum(int(s.attrib.get("skipped", "0")) for s in suites)
          failures = sum(int(s.attrib.get("failures", "0")) for s in suites)
          errors = sum(int(s.attrib.get("errors", "0")) for s in suites)
          tests = sum(int(s.attrib.get("tests", "0")) for s in suites)
          print(f"tests={tests} failures={failures} errors={errors} skipped={skipped}")
          if failures or errors or skipped:
              raise SystemExit("Oracle conformance requires 0 failures, 0 errors, and 0 skips")
          PY

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-oracle-3.12
          path: pytest-oracle-results.xml
          if-no-files-found: warn
          retention-days: 14
